name: Update Barbershop Boxes site

on:
  # GitHub Actions cron is UTC-only and does not shift for daylight saving,
  # so both possible UTC offsets for 11:00 AM America/New_York are scheduled.
  # 15:00 UTC = 11:00 AM EDT (Mar-Nov)   16:00 UTC = 11:00 AM EST (Nov-Mar)
  # The "Check it's actually 11am ET" step below no-ops on whichever run
  # doesn't match today's actual UTC offset, so only one run per day builds.
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # lets Marz trigger a manual rebuild from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check it's actually 11am ET (skip the non-matching cron run)
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ="America/New_York" date +%H)
          echo "Current hour in America/New_York: $hour"
          if [ "$hour" != "11" ]; then
            echo "Not 11am ET right now — skipping this run (the other cron entry will fire instead)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild site from latest scores
        if: env.SKIP != 'true'
        run: python3 build_site.py

      - name: Commit and push if index.html changed
        if: env.SKIP != 'true'
        run: |
          git config user.name "barbershop-boxes-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Auto-update: refresh results $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            git push
          else
            echo "No changes to index.html — nothing to commit."
          fi
