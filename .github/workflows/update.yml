name: Update Barbershop Boxes site

on:
  # Both entries cover the two possible UTC offsets for ~11am America/New_York
  # (EDT vs EST). Scheduled off the exact hour (:12 / :47) since GitHub delays
  # cron runs most heavily right at :00 — the previous version's hour-gate
  # kept getting skipped because those delays pushed it past the check.
  # build_site.py is idempotent and only commits when something changed, so
  # it's harmless to run it more than once a day.
  schedule:
    - cron: '12 15 * * *'
    - cron: '47 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild site from latest scores
        run: python3 build_site.py

      - name: Commit and push if index.html changed
        run: |
          git config user.name "barbershop-boxes-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Auto-update: refresh results $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            git push
          else
            echo "No changes to index.html — nothing to commit."
          fi
